version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: jumpserver_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jumpserver

  redis:
    image: redis:6.2
    container_name: jumpserver_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - jumpserver

  core:
    image: jumpserver/core:${JUMPSERVER_VERSION}
    container_name: jumpserver_core
    restart: always
    env_file:
      - jumpserver.env
    depends_on:
      - mysql
      - redis
    ports:
      - "80:80"
    volumes:
      - core_data:/opt/jumpserver/data
    networks:
      - jumpserver

volumes:
  mysql_data:
  redis_data:
  core_data:

networks:
  jumpserver:
